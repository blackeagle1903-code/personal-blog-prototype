<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Notebook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrapper">
    <header class="site-header">
      <a href="index.html" class="brand-title">Notebook</a>
      <nav class="nav-menu">
        <a href="index.html" class="nav-link">← Feed</a>
        <a href="admin.html" class="nav-link active">Admin</a>
      </nav>
    </header>

    <main>
      <!-- Publish Panel -->
      <section class="admin-card">
        <h2 class="card-heading">Publish Article</h2>
        <form id="post-form">
          <div class="form-group">
            <label class="form-label" for="title">Title</label>
            <input type="text" id="title" class="form-input" required placeholder="e.g. Can Machines Think?">
          </div>

          <div class="form-group">
            <label class="form-label" for="image">Cover Image</label>
            <input type="file" id="image" class="form-file-input" accept="image/*">
          </div>

          <div class="form-group">
            <label class="form-label" for="content">Content</label>
            <textarea id="content" class="form-textarea" required placeholder="Write your full essay or article here..."></textarea>
          </div>

          <button type="submit" class="btn-primary">Publish Entry</button>
        </form>
      </section>

      <!-- Manage List -->
      <section class="admin-card">
        <h2 class="card-heading">Published Articles</h2>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Date</th>
                <th style="text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="posts-table-body">
              <!-- Injected by app.js -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
